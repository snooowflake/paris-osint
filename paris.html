<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0d151e" />
    <title>Paris OSINT</title>
  </head>
  <body>
    <header>
      <a class="brand" href="/" aria-label="Paris OSINT, carte"
        ><span class="brand-mark">P/</span
        ><span
          >PARIS <b>OSINT</b
          ><small>Signaux publics · Paris uniquement</small></span
        ></a
      >
      <nav aria-label="Navigation principale">
        <button data-nav="map" aria-current="page">Carte</button
        ><button data-nav="situation">Situation</button
        ><button data-nav="history">Historique</button
        ><button data-nav="sources">Sources</button
        ><button data-nav="settings">Réglages</button>
      </nav>
      <span id="clock"></span>
    </header>
    <main id="main">
      <section id="map-page" aria-label="Carte de Paris">
        <div
          id="map"
          tabindex="0"
          aria-label="Carte interactive de Paris. Recherche, couches et contrôles de zoom sont accessibles au clavier."
        ></div>
        <aside id="layers" aria-label="Recherche et couches">
          <div class="panel-title">
            <h1>Paris, maintenant</h1>
            <button id="close-layers" aria-label="Fermer le panneau">
              Fermer
            </button>
          </div>
          <div class="search-box">
            <label for="search" class="visually-hidden"
              >Rechercher dans Paris</label
            >
            <input
              id="search"
              type="search"
              placeholder="Rechercher une adresse, une station, une ligne…"
              autocomplete="off"
            />
          </div>
          <div id="search-results" class="results" aria-live="polite"></div>
          <div id="layer-list"></div>
          <details>
            <summary>Favoris et vues enregistrées</summary>
            <div id="favorites-list"></div>
            <div id="views-list"></div>
            <button id="save-view">Enregistrer cette vue</button>
          </details>
          <div class="panel-foot">
            <p id="map-status" class="muted" aria-live="polite"></p>
            <button id="refresh" class="link-button">Actualiser</button>
          </div>
        </aside>
        <button id="show-layers">Couches et recherche</button>
        <div
          class="map-controls"
          role="toolbar"
          aria-label="Contrôles de la carte"
        >
          <button id="zoom-in" aria-label="Zoomer" title="Zoomer">+</button>
          <button id="zoom-out" aria-label="Dézoomer" title="Dézoomer">
            −
          </button>
          <button
            id="compass"
            aria-label="Orienter au nord"
            title="Orienter au nord"
          >
            <span class="needle" aria-hidden="true"></span>
          </button>
          <button
            id="view-mode"
            aria-pressed="false"
            title="Vue inclinée en 3D"
          >
            3D
          </button>
          <button
            id="recenter"
            aria-label="Recentrer sur Paris"
            title="Recentrer sur Paris"
          >
            <span aria-hidden="true">◎</span>
          </button>
          <button
            id="basemap-toggle"
            aria-expanded="false"
            aria-controls="basemap-menu"
            title="Fond de carte"
          >
            Fond
          </button>
        </div>
        <div
          id="basemap-menu"
          role="group"
          aria-label="Fond de carte"
          hidden
        ></div>
        <div id="map-legend" aria-label="Légende"></div>
        <article id="object-card" hidden aria-live="polite"></article>
        <div id="credits"></div>
        <div class="map-footer">
          <span>PARIS / 48.8566° N · 2.3522° E</span
          ><span>WGS84 · heures Europe/Paris</span>
        </div>
      </section>
      <section id="content-page" hidden tabindex="-1">
        <div id="page-content"></div>
        <button id="back-map">Retour à la carte</button>
      </section>
    </main>
    <div id="toast" role="status"></div>
    <script type="module" src="/src/paris/index.js"></script>
  </body>
</html>
